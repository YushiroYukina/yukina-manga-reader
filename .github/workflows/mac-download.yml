name: Build Mac v1.1 download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mac-download.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install native dependencies
        run: python -m pip install -r macos/requirements-mac-build.txt
      - name: Build and verify arm64 and ad-hoc signature
        run: python macos/scripts/build_macos.py
      - name: Verify archive decoder in the packaged application
        run: python macos/scripts/check_archive_bundle.py
      - name: Prepare downloadable archive
        run: |
          mkdir -p release-assets
          cp macos/release/Migi-Mac-arm64-v1.1.zip release-assets/yukina-manga-reader-macos-arm64-v1.1.zip
          cp macos/work/archive-bundle-checks.json release-assets/macos-build-checks-v1.1.json
          cd release-assets
          shasum -a 256 *.zip > macos-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-v1.1-download
          path: release-assets/*
      - name: Attach to v1.1 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1 --repo "$GITHUB_REPOSITORY" || gh release create v1.1 --draft --target "$GITHUB_SHA" --title "yukina漫画阅读器 v1.1" --notes "三端更新准备中。" --repo "$GITHUB_REPOSITORY"
          gh release upload v1.1 release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
